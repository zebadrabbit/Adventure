name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: adventure_test
          POSTGRES_USER: adventure
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pre-commit pytest pytest-cov ruff

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Check exception handling (ratchet — lower --max-count as cleanup progresses, never raise)
        run: python scripts/fix_exception_handling.py --check --max-count 62

      - name: Run tests (single run, coverage gate included)
        env:
          DATABASE_URL: postgresql://adventure:test_password@localhost:5432/adventure_test
          SECRET_KEY: test-secret-key-for-ci
        run: pytest -q --maxfail=1 --disable-warnings --cov=app --cov-report=term-missing --cov-fail-under=80

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build-test

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: adventure_e2e
          POSTGRES_USER: adventure
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          playwright install --with-deps chromium

      - name: Seed and boot server
        env:
          DATABASE_URL: postgresql://adventure:test_password@localhost:5432/adventure_e2e
          SECRET_KEY: e2e-secret-key
        run: |
          python run.py seed-merchants
          python run.py seed-skills
          nohup python run.py server > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:5000/ > /dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://localhost:5000/ > /dev/null

      - name: Run e2e smoke suite
        env:
          E2E: "1"
          ADVENTURE_BASE_URL: http://localhost:5000
        run: pytest e2e -q

      - name: Server log on failure
        if: failure()
        run: tail -100 server.log

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t adventure-mud:latest .

      - name: Test Docker image
        run: |
          docker run --rm adventure-mud:latest python -c "print('Docker image OK')"
